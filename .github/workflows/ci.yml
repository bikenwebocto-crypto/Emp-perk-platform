name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  AWS_REGION: "us-east-1"
  # Two separate repo names — staging and production live in different
  # AWS accounts / registries, so don't share one ECR_REPOSITORY var.
  ECR_REPOSITORY_STAGING: "employee_perk_platform"      # confirmed via IAM denial error message
  ECR_REPOSITORY_PRODUCTION: "bikenwebocto-crypto/emp-perk-platform"

jobs:

  # ============================================================
  # LINT & TYPE CHECK
  # ============================================================

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  # ============================================================
  # AWS OIDC TEST
  # ============================================================

  aws-auth:
    name: Test AWS OIDC Authentication
    runs-on: ubuntu-latest

    needs: [lint]

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{
            github.ref == 'refs/heads/main' &&
            'arn:aws:iam::043083732273:role/GitHubProductionDeployRole' ||
            'arn:aws:iam::547107369872:role/GitHubStagingDeployRole'
            }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Checks the SAME repo the corresponding build job will actually push to.
      - name: Verify ECR repository
        env:
          REPO_NAME: ${{ github.ref == 'refs/heads/main' && env.ECR_REPOSITORY_PRODUCTION || env.ECR_REPOSITORY_STAGING }}
        run: |
          aws ecr describe-repositories \
            --repository-names "${REPO_NAME}" \
            --region "${AWS_REGION}"

  # ============================================================
  # SUPABASE EDGE FUNCTIONS
  # ============================================================
  #
  # deploy-supabase-functions:
  #   name: Deploy Supabase Functions
  #   runs-on: ubuntu-latest
  #
  #   needs: [lint]
  #
  #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
  #
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: npm
  #
  #     - name: Install dependencies
  #       run: npm ci
  #
  #     - name: Deploy Supabase Functions
  #       run: npx supabase functions deploy --project-ref "${{ env.SUPABASE_PROJECT_REF }}"
  #       env:
  #         SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  #         SUPABASE_PROJECT_REF: ${{
  #           github.ref == 'refs/heads/main' &&
  #           vars.SUPABASE_PROJECT_REF_PRODUCTION ||
  #           vars.SUPABASE_PROJECT_REF_STAGING }}

  # ============================================================
  # DOCKER BUILD & PUSH - STAGING
  # ============================================================

  docker-build-staging:
    name: Docker Build & Push - Staging
    runs-on: ubuntu-latest

    needs:
      - lint
      - aws-auth

    if: github.ref == 'refs/heads/dev'

    # Required so this job can read secrets stored under the "staging_env"
    # GitHub Environment. Without this, environment secrets resolve to
    # empty even if they exist — they're only exposed to jobs that
    # explicitly declare this environment.
    environment: staging_env

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::547107369872:role/GitHubStagingDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # push: true — buildx pushes directly, no separate "docker push" step needed
      # (push:false with no load:true leaves the image out of the local Docker
      # daemon, so a later manual `docker push` fails with "no such image").
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_STAGING }}:staging-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_STAGING }}:${{ github.sha }}
          secrets: |
            database_url=${{ secrets.DATABASE_URL }}
            next_public_supabase_url=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            next_public_supabase_publishable_key=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            next_public_app_url=${{ secrets.NEXT_PUBLIC_APP_URL }}
            next_public_google_maps_api_key=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            next_public_google_maps_map_id=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
            next_public_firebase_api_key=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            next_public_firebase_auth_domain=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            next_public_firebase_project_id=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            next_public_firebase_storage_bucket=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            next_public_firebase_messaging_sender_id=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            next_public_firebase_app_id=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            next_public_firebase_measurement_id=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            next_public_firebase_vapid_key=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
      # ----------------------------------------------------------
      # ECS - Get Current Task Definition
      # ----------------------------------------------------------
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION_STAGING }}" \
            --query taskDefinition \
            --output json > task-definition.json

      # ----------------------------------------------------------
      # ECS - Replace Container Image
      # ----------------------------------------------------------
      - name: Render ECS task definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME_STAGING }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_STAGING }}:${{ github.sha }}

      # ----------------------------------------------------------
      # ECS - Deploy
      # ----------------------------------------------------------
      - name: Deploy to ECS - Staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_STAGING }}
          cluster: ${{ vars.ECS_CLUSTER_STAGING }}
          wait-for-service-stability: true

  # ============================================================
  # DOCKER BUILD & PUSH - PRODUCTION
  # ============================================================

  docker-build-production:
    name: Docker Build & Push - Production
    runs-on: ubuntu-latest

    needs:
      - lint
      - aws-auth

    if: github.ref == 'refs/heads/main'
    environment: production_env

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::043083732273:role/GitHubProductionDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
 
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PRODUCTION }}:production-latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PRODUCTION }}:${{ github.sha }}
          secrets: |
            database_url=${{ secrets.DATABASE_URL }}
            next_public_supabase_url=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            next_public_supabase_publishable_key=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            next_public_app_url=${{ secrets.NEXT_PUBLIC_APP_URL }}
            next_public_google_maps_api_key=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            next_public_google_maps_map_id=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
            next_public_firebase_api_key=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            next_public_firebase_auth_domain=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            next_public_firebase_project_id=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            next_public_firebase_storage_bucket=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            next_public_firebase_messaging_sender_id=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            next_public_firebase_app_id=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            next_public_firebase_measurement_id=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            next_public_firebase_vapid_key=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
